name: Continuous Integration
run-name: CI · ${{ github.head_ref || github.ref_name }} @ ${{ github.sha }}

# 持续集成：推代码、开 PR 时验证"能不能编过"。
#
# 这个工作流**永远不会发布任何东西**——没有 tag、没有 release、没有
# update.json 改动。产物只作为 Actions artifact 保留，方便人工下载试装。
#
# 真发布走 release.yml（打 tag 触发），而且只发 pre-release。

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
  workflow_dispatch:
    inputs:
      kmis:
        description: '要验证的 KMI（逗号分隔）。日常测试编一个就够了'
        required: false
        type: string
        default: 'android14-6.1'
      full_matrix:
        description: '构建全部 KMI（默认只编一个，发布才需要全量）'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify
    uses: ./.github/workflows/build.yml
    with:
      # CI 是"这次改动还能不能编译"的快速验证，不是发布前的全量回归。
      # 默认只编一个 KMI：镜像拉取是每次构建的固定成本（实测约 54s），
      # 7 个 KMI 就是 7 份这个成本，而关键路径只取决于最慢的那一个 ——
      # 全量并不会让结果更早出来，只多烧 runner 分钟。
      # 需要全量时勾 full_matrix，或手动指定 kmis。
      # 不要用 '' 作哨兵：GitHub 表达式里空串是 falsy，
      # `true && '' || X` 会求值成 X —— 全量开关就这么静默失效过。
      kmis: ${{ inputs.full_matrix && 'all' || (inputs.kmis || 'android14-6.1') }}
      package: false   # CI 不做模块打包，产物只留 ko-* artifact

  # 汇总一次，让 PR 上能一眼看到各 KMI 产出了哪些 .ko
  summarize:
    name: Summarize artifacts
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ko-*
          path: ko-all
          merge-multiple: true

      - name: Write run summary
        run: |
          set -euo pipefail
          echo "### Build artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if compgen -G "ko-all/*.ko" > /dev/null; then
            echo "| Module | KMI | Size | vermagic |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
            for f in ko-all/*.ko; do
              n=$(basename "$f" .ko)
              mod=${n%-android*}
              kmi=${n#*-}
              vm=$(grep -ao 'vermagic=[^ ]*' "$f" | head -1 | sed 's/vermagic=//')
              sz=$(du -h "$f" | cut -f1)
              echo "| \`$mod\` | \`$kmi\` | $sz | \`$vm\` |" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "No `.ko` artifacts were produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "See the run artifacts. CI never publishes; releases are cut from a tag via `release.yml`." >> "$GITHUB_STEP_SUMMARY"
