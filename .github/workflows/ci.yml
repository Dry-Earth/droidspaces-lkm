name: CI

# 持续集成：推代码、开 PR 时验证"能不能编过"。
#
# 这个工作流**永远不会发布任何东西**——没有 tag、没有 release、没有
# update.json 改动。产物只作为 Actions artifact 保留，方便人工下载试装。
#
# 真发布走 release.yml（打 tag 触发），而且只发 pre-release。

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
  workflow_dispatch:
    inputs:
      kmis:
        description: '逗号分隔的 KMI 列表, 留空=全部'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    uses: ./.github/workflows/build.yml
    with:
      kmis: ${{ inputs.kmis || '' }}

  # 汇总一次，让 PR 上能一眼看到各 KMI 产出了哪些 .ko
  summarize:
    name: summarize
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v8
        with:
          pattern: ko-*
          path: ko-all
          merge-multiple: true

      - name: 汇总
        run: |
          set -euo pipefail
          echo "### 本次构建产物" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if compgen -G "ko-all/*.ko" > /dev/null; then
            echo "| 模块 | KMI | 大小 | vermagic |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
            for f in ko-all/*.ko; do
              n=$(basename "$f" .ko)
              mod=${n%-android*}
              kmi=${n#*-}
              vm=$(grep -ao 'vermagic=[^ ]*' "$f" | head -1 | sed 's/vermagic=//')
              sz=$(du -h "$f" | cut -f1)
              echo "| \`$mod\` | \`$kmi\` | $sz | \`$vm\` |" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "本次没有产出任何 .ko。" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "产物见本次运行的 Artifacts。CI 不发布 Release；发布请打 tag 走 release.yml。" >> "$GITHUB_STEP_SUMMARY"
