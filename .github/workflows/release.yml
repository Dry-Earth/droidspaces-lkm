name: Release

# 真发布：只有打 tag 才会走到这里。
#
# 当前阶段**只发 pre-release**（GitHub 上的 Pre-release 标记），因为还没有
# 一个经过完整真机回归的正式版本。等正式版准备好了，把下面 gh release
# create 的 --prerelease 去掉即可。
#
# 与 ci.yml 的区别：ci 只编译验证、产物留 artifact；这里会创建 GitHub
# Release 并上传 .ko / 模块 zip / 源码快照。

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 v0.1.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    uses: ./.github/workflows/build.yml
    with:
      package: true

  publish:
    name: publish
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v6

      - name: 下载构建产物
        # Package job 已经把 .ko、模块 zip 和源码快照都做好了（artifact
        # droidspaces-lkm-dist）。这里不再重新打包一遍 —— 之前那版会重新
        # 压所有 zip 和源码快照，多花约 35 秒，而且两份逻辑容易走偏。
        uses: actions/download-artifact@v8
        with:
          name: droidspaces-lkm-dist
          path: dist

      - name: 列出产物
        run: |
          set -euo pipefail
          ls -lh dist/
          compgen -G "dist/*.zip" > /dev/null || { echo "::error::没有模块包"; exit 1; }
          compgen -G "dist/*.ko" > /dev/null || { echo "::error::没有 .ko"; exit 1; }

      - name: 创建 pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          sh scripts/release_notes.sh dist > notes.md
          cat notes.md

          # --prerelease 是当前阶段的硬性要求：还没有经过完整真机回归的
          # 正式版本，任何发布都只能是预览版。
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Droidspaces LKM $TAG (preview)" \
            --prerelease \
            --notes-file notes.md \
            dist/*.ko dist/*.zip dist/source-*.tar.gz
