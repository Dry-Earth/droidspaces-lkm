name: Release

# 真发布：只有打 tag 才会走到这里。
#
# 当前阶段**只发 pre-release**（GitHub 上的 Pre-release 标记），因为还没有
# 一个经过完整真机回归的正式版本。等正式版准备好了，把下面 gh release
# create 的 --prerelease 去掉即可。
#
# 与 ci.yml 的区别：ci 只编译验证、产物留 artifact；这里会创建 GitHub
# Release 并上传 .ko / 模块 zip / 源码快照。

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag，例如 v0.1.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    uses: ./.github/workflows/build.yml

  publish:
    name: publish
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v6

      - name: 下载产物
        uses: actions/download-artifact@v8
        with:
          pattern: ko-*
          path: ko-all
          merge-multiple: true

      - name: 整理
        run: |
          set -euo pipefail
          mkdir -p dist
          find ko-all -name '*.ko' -exec cp {} dist/ \;
          ls -lh dist/
          [ -n "$(ls -A dist)" ] || { echo "::error::没有任何 .ko"; exit 1; }

      - name: 生成源码快照 (GPL-2.0 要求)
        run: |
          set -euo pipefail
          rm -rf /tmp/src && mkdir -p /tmp/src
          if git clone --depth=1 --branch lkm4ctr \
               https://github.com/cyanmint/lkm4ctr.git /tmp/src/lkm4ctr 2>/dev/null; then
            :
          else
            git clone --depth=1 https://github.com/cyanmint/lkm4ctr.git /tmp/src/lkm4ctr
          fi
          for p in patches/*.patch; do
            [ -f "$p" ] && git -C /tmp/src/lkm4ctr apply "$PWD/$p" || true
          done
          rm -rf /tmp/src/lkm4ctr/.git
          tar cf - --exclude=.git --exclude=dist --exclude=out . | ( cd /tmp/src && tar xf - )
          tar czf dist/source-$(date +%Y%m%d).tar.gz -C /tmp/src .
          ls -lh dist/source-*.tar.gz

      - name: 打包 KernelSU 模块
        run: |
          set -euo pipefail
          command -v zip >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zip unzip; }

          stage() {
            local dst="$1"; shift
            rm -rf "$dst"; mkdir -p "$dst/ko"
            cp module/module.prop module/customize.sh module/service.sh \
               module/uninstall.sh module/action.sh "$dst/"
            chmod 755 "$dst"/*.sh
            sed -i 's/\r$//' "$dst"/*.sh "$dst/module.prop"
          }

          # 全 KMI 合并包
          stage "$RUNNER_TEMP/all"
          cp dist/*.ko "$RUNNER_TEMP/all/ko/"
          ( cd "$RUNNER_TEMP/all" && zip -qr1 "$GITHUB_WORKSPACE/dist/droidspaces-lkm-arm64.zip" . )

          # 按 KMI 单包
          for f in dist/*.ko; do
            kmi=$(basename "$f" | sed -E 's/^[a-z0-9_]+-(android[0-9]+-[0-9.]+)\.ko$/\1/')
            case "$kmi" in android*) ;; *) continue ;; esac
            stage "$RUNNER_TEMP/one-$kmi"
            cp dist/*-"$kmi".ko "$RUNNER_TEMP/one-$kmi/ko/"
            ( cd "$RUNNER_TEMP/one-$kmi" && \
              zip -qr1 "$GITHUB_WORKSPACE/dist/droidspaces-lkm-$kmi-arm64.zip" . )
          done
          ls -lh dist/*.zip

      - name: 创建 pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          sh scripts/release_notes.sh dist > notes.md
          cat notes.md

          # --prerelease 是当前阶段的硬性要求：还没有经过完整真机回归的
          # 正式版本，任何发布都只能是预览版。
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Droidspaces LKM $TAG (preview)" \
            --prerelease \
            --notes-file notes.md \
            dist/*.ko dist/*.zip dist/source-*.tar.gz
