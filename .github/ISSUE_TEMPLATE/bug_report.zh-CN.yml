name: 问题反馈（中文）
description: 模块装不上、能力不可用、开机异常等
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        这类问题九成取决于**内核版本、KMI 和模块版本三者对不对得上**，所以下面
        每一项都请照实填。

        在开始之前，请先做两件事：

        1. 装最新版本，确认问题还在（旧版本的问题可能已经修了）
        2. 点一下 KernelSU 模块页的**「操作」按钮**，把输出复制下来——那一段
           就包含设备信息、加载状态和能力自检结果

  - type: input
    id: device
    attributes:
      label: 设备型号与系统
      description: 设置 → 关于手机 里的型号，以及 Android 版本 / ROM 名称
      placeholder: "例如：OPPO Find X7 (PHZ110)，Android 14，ColorOS 15"
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: 内核版本
      description: 终端执行 `uname -r` 的完整输出，不要只写 "6.1"
      placeholder: "例如：6.1.157-android14-11-o-g2d576b643492"
    validations:
      required: true

  - type: input
    id: module_version
    attributes:
      label: 模块版本
      description: KernelSU 模块列表里显示的版本号，或 `module.prop` 里的 version
      placeholder: "例如：v0.1.22"
    validations:
      required: true

  - type: dropdown
    id: ksu_type
    attributes:
      label: KernelSU 类型
      options:
        - GKI 模式（内核已内置 KernelSU）
        - LKM 模式（自己 insmod kernelsu.ko）
        - 其他 / 不确定
    validations:
      required: true

  - type: dropdown
    id: display_route
    attributes:
      label: 显示路线（有桌面显示问题时填写）
      options:
        - Anland 6.x（waylandbridge：/dev/mali0 + mali_nsfix，不需要 vkms）
        - Anland 5.x / 自带合成器桌面（KDE/GNOME/Hyprland/Niri/Mango/Denial：需 vkms 提供 /dev/dri/renderD128）
        - 没跑桌面 / 不确定
    validations:
      required: false

  - type: dropdown
    id: symptom
    attributes:
      label: 现象
      multiple: true
      options:
        - 模块不支持 / 装不上
        - 装上了但模块没加载
        - 加载了但容器能力不可用（PID/IPC namespace）
        - 容器内无法挂载 /proc 或其他文件系统
        - 没有 /dev/dri/renderD128（Wayland 桌面起不来；5.x / 自带合成器需 vkms）
        - 开机卡住 / 重启 / 进安全模式
        - 其他
    validations:
      required: true

  - type: textarea
    id: action_output
    attributes:
      label: 「操作」按钮输出
      description: KernelSU 模块页点「操作」后的完整输出，能覆盖一半以上的信息量
      render: shell
      placeholder: |
        === Droidspaces LKM ===
        内核    : ...
        模块版本: ...
        ...
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 模块日志
      description: |
        `cat /data/adb/droidspaces_lkm.log` 的内容。
        如果文件不存在（说明 service.sh 根本没跑到），请说明这一点。
      render: shell
    validations:
      required: false

  - type: textarea
    id: bootlog
    attributes:
      label: 开机日志
      description: |
        开机类问题没有这几份日志基本无法定位。请**作为文件附件**传上来，不要只截图。

        1. 本次开机的内核日志
           su -c dmesg > /sdcard/dmesg.txt

        2. 模块自己的日志
           su -c 'cat /data/adb/droidspaces_lkm.log' > /sdcard/droidspaces_lkm.log
           （文件不存在说明 service.sh 没跑，请注明）

        3. 开机卡住、重启、进安全模式时，要**上一轮**开机的日志
           su -c 'cat /sys/fs/pstore/console-ramoops-0' > /sdcard/pstore.txt
           老内核: /proc/last_kmsg
           要含 pc 与 lr

        顺手带上这两条更好:
           su -c 'cat /proc/crypto' > /sdcard/crypto.txt
           su -c lsmod > /sdcard/lsmod.txt

        拿不到 root 就写「无 root，无法抓取」并描述现象。
      placeholder: |
        上传上面那几个 .txt，或直接粘贴 dmesg / 模块日志 / pstore 的关键段落。
    validations:
      required: true

  - type: textarea
    id: bootimg
    attributes:
      label: boot 镜像（装不上时强烈建议提供）
      description: |
        每家厂商裁掉的 EXPORT_SYMBOL 集合都不一样。日志只说明**缺了什么**，
        只有 boot 镜像能说明这台内核**到底导出了什么**。有了它，我可以在你
        刷机**之前**就把每个模块和你的内核比对一遍 —— 不用再来回
        「刷机 → 失败 → 贴日志」。

        怎么取（任选一种）：

        1. 从官方固件包里提取（不用 root）
           下载你机型对应版本的完整 OTA 包，里面通常有 boot.img 或
           init_boot.img。

        2. 从设备上直接 dd（需要 root）
           su -c 'ls -l /dev/block/by-name/boot*'
           su -c 'dd if=/dev/block/by-name/boot_a of=/sdcard/boot.img'
           A/B 分区的设备试 boot_a 和 boot_b，哪个能读到就用哪个。

        3. 从 payload.bin 提取
           用 payload_dumper：https://github.com/vm03/payload_dumper

        隐私：boot.img 里只有内核和 ramdisk，**不含个人数据、账号或应用**。

        不方便给也没关系 —— 在设备上跑这一条，把输出贴上来，效果完全一样：

           su -c "grep -a '__ksymtab_' /proc/kallsyms | sed 's/.*__ksymtab_//' | sort -u" > exports.txt
      placeholder: |
        把 boot.img 作为文件附件传上来，或粘贴 exports.txt 的内容
        （约两万个符号名），两者都拿不到就写「无法获取」。
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 刷入模块 vX
        2. 重启
        3. 执行 ...
        4. 看到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为 vs 实际行为
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已用最新版本复测，问题仍然存在
          required: true
        - label: 已确认 `uname -r` 与所选 KMI 匹配（每个包是针对一个内核编的）
          required: true
        - label: 贴出的日志里没有打码掉关键信息（内核版本、地址、报错都要保留）
          required: true