name: 问题反馈（中文）
description: 模块装不上、能力不可用、开机异常等
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        这类问题九成取决于**内核版本、KMI 和模块版本三者对不对得上**，所以下面
        每一项都请照实填。

        在开始之前，请先做两件事：

        1. 装最新版本，确认问题还在（旧版本的问题可能已经修了）
        2. 点一下 KernelSU 模块页的**「操作」按钮**，把输出复制下来——那一段
           就包含设备信息、加载状态和能力自检结果

  - type: input
    id: device
    attributes:
      label: 设备型号与系统
      description: 设置 → 关于手机 里的型号，以及 Android 版本 / ROM 名称
      placeholder: "例如：OPPO Find X7 (PHZ110)，Android 14，ColorOS 15"
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: 内核版本
      description: 终端执行 `uname -r` 的完整输出，不要只写 "6.1"
      placeholder: "例如：6.1.157-android14-11-o-g2d576b643492"
    validations:
      required: true

  - type: input
    id: module_version
    attributes:
      label: 模块版本
      description: KernelSU 模块列表里显示的版本号，或 `module.prop` 里的 version
      placeholder: "例如：v0.1.22"
    validations:
      required: true

  - type: dropdown
    id: ksu_type
    attributes:
      label: KernelSU 类型
      options:
        - GKI 模式（内核已内置 KernelSU）
        - LKM 模式（自己 insmod kernelsu.ko）
        - 其他 / 不确定
    validations:
      required: true

  - type: dropdown
    id: symptom
    attributes:
      label: 现象
      multiple: true
      options:
        - 模块不支持 / 装不上
        - 装上了但模块没加载
        - 加载了但容器能力不可用（PID/IPC namespace）
        - 容器内无法挂载 /proc 或其他文件系统
        - 没有 /dev/dri/renderD128（Wayland 桌面起不来）
        - 开机卡住 / 重启 / 进安全模式
        - 其他
    validations:
      required: true

  - type: textarea
    id: action_output
    attributes:
      label: 「操作」按钮输出
      description: KernelSU 模块页点「操作」后的完整输出，能覆盖一半以上的信息量
      render: shell
      placeholder: |
        === Droidspaces LKM ===
        内核    : ...
        模块版本: ...
        ...
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 模块日志
      description: |
        `cat /data/adb/droidspaces_lkm.log` 的内容。
        如果文件不存在（说明 service.sh 根本没跑到），请说明这一点。
      render: shell
    validations:
      required: false

  - type: textarea
    id: bootlog
    attributes:
      label: Boot logs / 开机日志文件
      description: |
        Boot problems cannot be diagnosed without these. Attach them **as
        files**, not screenshots.
        开机类问题没有这几份日志基本无法定位。请**作为文件附件**传上来，不要只截图。

        1. this boot's kernel log / 本次开机的内核日志
           su -c dmesg > /sdcard/dmesg.txt

        2. the module's own log / 模块自己的日志
           su -c 'cat /data/adb/droidspaces_lkm.log' > /sdcard/droidspaces_lkm.log
           （文件不存在说明 service.sh 没跑，请注明 / if the file is missing,
           service.sh never ran — say so）

        3. for hangs, reboots or safe mode, the *previous* boot's log /
           开机卡住、重启、进安全模式时，要上一轮开机的日志
           su -c 'cat /sys/fs/pstore/console-ramoops-0' > /sdcard/pstore.txt
           older kernels / 老内核: /proc/last_kmsg
           include pc and lr / 要含 pc 与 lr

        Also useful / 顺手带上这两条更好:
           su -c 'cat /proc/crypto' > /sdcard/crypto.txt
           su -c lsmod > /sdcard/lsmod.txt

        No root? Write "no root, cannot capture" and describe what you saw.
        拿不到 root 就写「无 root，无法抓取」并描述现象。
      placeholder: |
        Upload the .txt files, or paste the relevant parts here.
        上传上面那几个 .txt，或直接粘贴 dmesg / 模块日志 / pstore 的关键段落。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 刷入模块 vX
        2. 重启
        3. 执行 ...
        4. 看到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为 vs 实际行为
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 已用最新版本复测，问题仍然存在
          required: true
        - label: 已确认 `uname -r` 与所选 KMI 匹配（每个包是针对一个内核编的）
          required: true
        - label: 贴出的日志里没有打码掉关键信息（内核版本、地址、报错都要保留）
          required: true