name: Bug report
description: Module fails to install, capabilities unavailable, boot problems
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Most reports of this kind depend on whether **kernel version, KMI and module
        version agree with each other**, so every field below matters.

        Before filing, do two things:

        1. Install the latest release and confirm the problem persists (older
           releases may already contain the fix).
        2. Press the **Action** button on the KernelSU module page and copy its
           output — that block already contains device information, load state
           and the capability self-check.

  - type: input
    id: device
    attributes:
      label: Device and OS
      description: Model from Settings → About phone, plus Android version / ROM name
      placeholder: "e.g. OPPO Find X7 (PHZ110), Android 14, ColorOS 15"
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Kernel version
      description: Full `uname -r` output; do not write only "6.1"
      placeholder: "e.g. 6.1.157-android14-11-o-g2d576b643492"
    validations:
      required: true

  - type: input
    id: module_version
    attributes:
      label: Module version
      description: The version shown in the KernelSU module list, or `version` in `module.prop`
      placeholder: "e.g. v0.1.22"
    validations:
      required: true

  - type: dropdown
    id: ksu_type
    attributes:
      label: KernelSU variant
      options:
        - GKI mode (KernelSU built into the kernel)
        - LKM mode (loading kernelsu.ko manually)
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: symptom
    attributes:
      label: Symptom
      multiple: true
      options:
        - Module not supported / install fails
        - Installs but the module does not load
        - Loads but container capabilities are unavailable (PID/IPC namespace)
        - Cannot mount /proc or other filesystems inside the container
        - No /dev/dri/renderD128 (Wayland desktop fails to start)
        - Boot hangs / reboots / drops to safe mode
        - Other
    validations:
      required: true

  - type: textarea
    id: action_output
    attributes:
      label: Action button output
      description: Full output of the Action button on the KernelSU module page; it covers more than half of what is needed
      render: shell
      placeholder: |
        === Droidspaces LKM ===
        Kernel  : ...
        Version : ...
        ...
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Module log
      description: |
        Contents of `cat /data/adb/droidspaces_lkm.log`.
        If the file does not exist (meaning `service.sh` never ran), say so explicitly.
      render: shell
    validations:
      required: false

  - type: textarea
    id: bootlog
    attributes:
      label: Boot logs
      description: |
        Boot problems cannot be diagnosed without these. Attach them **as
        files**, not screenshots.

        1. This boot's kernel log
           su -c dmesg > /sdcard/dmesg.txt

        2. The module's own log
           su -c 'cat /data/adb/droidspaces_lkm.log' > /sdcard/droidspaces_lkm.log
           (if the file is missing, service.sh never ran -- say so)

        3. For hangs, reboots or safe mode: the *previous* boot's log
           su -c 'cat /sys/fs/pstore/console-ramoops-0' > /sdcard/pstore.txt
           older kernels: /proc/last_kmsg
           must include pc and lr

        Also useful:
           su -c 'cat /proc/crypto' > /sdcard/crypto.txt
           su -c lsmod > /sdcard/lsmod.txt

        No root? Write "no root, cannot capture" and describe what you saw.
      placeholder: |
        Upload the .txt files, or paste the relevant parts here.
    validations:
      required: true

  - type: textarea
    id: bootimg
    attributes:
      label: Boot image (strongly recommended for load failures)
      description: |
        Every vendor trims a different set of EXPORT_SYMBOLs. A log tells us
        what is *missing*; only the boot image tells us what this kernel
        actually *exports*. With it I can check every module against your
        kernel **before** you flash anything -- no more round-trips of
        "flash -> fails -> send log".

        How to get it (pick one):

        1. From the official firmware package (no root needed)
           Unpack the full OTA for your exact model. boot.img or
           init_boot.img is usually inside.

        2. dd from the device (root required)
           su -c 'ls -l /dev/block/by-name/boot*'
           su -c 'dd if=/dev/block/by-name/boot_a of=/sdcard/boot.img'
           On A/B devices try boot_a and boot_b -- whichever reads.

        3. From payload.bin via payload_dumper
           https://github.com/vm03/payload_dumper

        Privacy: boot.img contains the kernel and ramdisk only -- no personal
        data, accounts or apps.

        Not comfortable sharing it? Run this instead and paste the output.
        The result is identical:

           su -c "grep -a '__ksymtab_' /proc/kallsyms | sed 's/.*__ksymtab_//' | sort -u" > exports.txt
      placeholder: |
        Attach boot.img as a file, or paste the exports.txt content here
        (about 20k symbol names), or write "cannot obtain" if neither is
        possible.
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Flash module vX
        2. Reboot
        3. Run ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behaviour
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: Retested on the latest release and the problem persists
          required: true
        - label: Confirmed `uname -r` matches the selected KMI (each package is built for one kernel)
          required: true
        - label: The logs below are not redacted (kernel version, addresses and error text must be preserved)
          required: true