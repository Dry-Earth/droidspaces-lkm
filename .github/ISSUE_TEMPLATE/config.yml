# Issue 模板选择页的配置
#
# GitHub 的这个页面没有 i18n 机制：name / description 对所有访客渲染同一份，
# 不按 locale 分发。所以这里两个名字并列，模板本身拆成两份
# （bug_report.yml 英文、bug_report.zh-CN.yml 中文），由用户自己选。

blank_issues_enabled: false

contact_links:
  - name: Installation and usage / 安装与使用
    url: https://github.com/misaka5202/droidspaces-lkm#readme
    about: Read the Installation and Known limitations sections first; most reports are a KMI mismatch. 先看 README 的「安装」和「已知限制」，很多问题是 KMI 不匹配。

  - name: Kernel support matrix / 内核支持范围
    url: https://github.com/misaka5202/droidspaces-lkm/blob/master/docs/KMI-COVERAGE.en.md
    about: Which KMIs have artifacts and how far each has been verified. 哪些 KMI 有产物、各自验证到什么程度。